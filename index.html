<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#49362f">
  <meta name="description" content="الروابط الرسمية وطرق الدفع الخاصة ببراند NAQSH | نقش.">
  <title>NAQSH | نقش — الروابط الرسمية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <section class="profile" aria-label="NAQSH">
      <div class="logo-frame">
        <img src="naqsh-logo.jpeg" alt="شعار NAQSH نقش" class="logo">
      </div>
      <h1>NAQSH <span>|</span> نقش</h1>
      <div class="ornament" aria-hidden="true"><span></span><i>✦</i><span></span></div>
    </section>

    <section class="link-section" aria-label="روابط التواصل">
      <div class="section-heading"><span>روابطنا الرسمية</span></div>
      <div class="link-list" id="social-links"></div>
    </section>

    <section class="link-section payment-section" aria-label="طرق الدفع">
      <div class="section-heading"><span>طرق الدفع المتاحة</span></div>
      <div class="link-list" id="payment-links"></div>
      <p class="payment-note" id="payment-note" hidden>سيتم إضافة رابط وسيلة الدفع قريبًا.</p>
    </section>

    <footer>© 2026 NAQSH <span>|</span> نقش</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
